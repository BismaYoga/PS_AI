function eventsTable(){
  const mNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const now = new Date();
  const refDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const todayStr = refDate.toISOString().slice(0,10);
  
  let list = EVENTS.filter(e => {
    const matchType = (state.eventType === 'Semua' || e.type === state.eventType);
    let matchMonth = true;
    if (state.eventMonth === 'upcoming') {
      matchMonth = e.date >= todayStr;
    } else if (state.eventMonth !== 'all') {
      matchMonth = e.date.startsWith(state.eventMonth) || e.date.slice(5,7) === state.eventMonth;
    }
    return matchType && matchMonth;
  });

  // Urutkan dari tanggal terdekat ke hari ini (dinamis)
  list.sort((a, b) => {
    const da = new Date(a.date + 'T00:00:00');
    const db = new Date(b.date + 'T00:00:00');
    const diffA = Math.round((da - refDate) / (1000 * 60 * 60 * 24));
    const diffB = Math.round((db - refDate) / (1000 * 60 * 60 * 24));
    const isUpA = diffA >= 0;
    const isUpB = diffB >= 0;
    if (isUpA && isUpB) return diffA - diffB; // Mendatang: urut hari tersedikit (terdekat)
    if (!isUpA && !isUpB) return diffB - diffA; // Berlalu: urut hari terbaru (terdekat)
    return isUpA ? -1 : 1; // Prioritaskan agenda mendatang
  });

  // Paginasi: 10 item per halaman
  const pageSize = state.eventPageSize || 10;
  const totalPages = Math.ceil(list.length / pageSize) || 1;
  if (state.eventPage > totalPages) state.eventPage = totalPages;
  if (state.eventPage < 1) state.eventPage = 1;
  const startIdx = (state.eventPage - 1) * pageSize;
  const pagedList = list.slice(startIdx, startIdx + pageSize);

  // Tombol navigasi halaman
  let pageButtons = '';
  if (totalPages > 1) {
    const p = state.eventPage;
    const pagesToShow = new Set([1, totalPages, p, p - 1, p + 1].filter(x => x >= 1 && x <= totalPages));
    const sortedPages = [...pagesToShow].sort((a, b) => a - b);
    let prev = 0;
    for (const pageNum of sortedPages) {
      if (prev && pageNum - prev > 1) {
        pageButtons += `<span style="color:var(--muted);padding:0 2px;font-size:11px;">â€¦</span>`;
      }
      pageButtons += `<button class="btn small-btn ${pageNum === p ? 'primary' : ''}" onclick="changeEventPage(${pageNum})" style="min-width:28px;padding:4px 7px;font-size:11px;font-weight:600;">${pageNum}</button>`;
      prev = pageNum;
    }
  }

  const paginationHtml = totalPages > 1 ? `
<div class="pagination-bar" style="display:flex;align-items:center;justify-content:space-between;padding:11px 20px;border-top:1px solid var(--line);background:#fafbfc;flex-wrap:wrap;gap:10px;">
  <div style="font-size:11px;color:var(--muted);">
    Menampilkan <b>${startIdx + 1}â€“${Math.min(startIdx + pageSize, list.length)}</b> dari <b>${list.length}</b> agenda riil
  </div>
  <div style="display:flex;align-items:center;gap:5px;">
    <button class="btn small-btn" onclick="changeEventPage(${state.eventPage - 1})" ${state.eventPage <= 1 ? 'disabled' : ''} style="padding:4px 9px;font-size:11px;">
      ${icon('chevron','sm')} Sebelumnya
    </button>
    <div style="display:flex;align-items:center;gap:3px;">${pageButtons}</div>
    <button class="btn small-btn" onclick="changeEventPage(${state.eventPage + 1})" ${state.eventPage >= totalPages ? 'disabled' : ''} style="padding:4px 9px;font-size:11px;">
      Selanjutnya ${icon('right','sm')}
    </button>
  </div>
</div>` : '';

  return `<div class="card"><div class="table-scroll"><table class="data-table calendar-table"><thead><tr><th class="date-column">Tanggal</th><th>Emiten</th><th class="event-column">Agenda</th><th>Jenis</th><th class="number">Nilai / Estimasi</th></tr></thead><tbody>${pagedList.length?pagedList.map(e=>{
    const day = e.date.slice(8,10);
    const mIdx = parseInt(e.date.slice(5,7),10) - 1;
    const mStr = mNames[mIdx] || e.date.slice(5,7);
    const yr = e.date.slice(0,4);
    const isEarn = e.type === 'Laporan Keuangan';
    const pillClass = isEarn ? 'blue' : 'green';
    
    // Status countdown hari
    const evDate = new Date(e.date + 'T00:00:00');
    const diffDays = Math.round((evDate - refDate) / (1000 * 60 * 60 * 24));
    let timingPill = '';
    if (diffDays === 0) {
      timingPill = '<span class="pill green" style="font-size:9px;padding:2px 6px;margin-left:6px;">Hari Ini</span>';
    } else if (diffDays > 0) {
      timingPill = `<span class="pill blue" style="font-size:9px;padding:2px 6px;margin-left:6px;">${diffDays} hari lagi</span>`;
    } else {
      timingPill = `<span class="pill outline" style="font-size:9px;padding:2px 6px;margin-left:6px;">${Math.abs(diffDays)} hari lalu</span>`;
    }

    return `<tr><td><div class="date-stamp"><div class="date-number">${day}<span>${mStr}</span></div><span class="small muted">${yr}</span></div></td><td>${stockIdentity(getStock(e.ticker))}</td><td><div class="event-title">${e.title} ${timingPill}</div><div class="event-sub">${e.sub}</div></td><td><span class="pill ${pillClass}">${e.type}</span></td><td class="number"><button class="btn small-btn" data-event="${e.id}" aria-label="Lihat agenda ${e.ticker}: ${e.title}" style="padding:4px 9px;font-size:11px;">${e.amount} ${icon('arrow-up-right','sm')}</button></td></tr>`;
  }).join(''):'<tr><td colspan="5"><div class="empty-state">Tidak ada agenda pasar untuk filter ini.</div></td></tr>'}</tbody></table></div>${paginationHtml}<div class="table-note"><span>Jadwal riil rilis laporan keuangan kuartalan & pembagian dividen tunai emiten IDX Â· Urut terdekat dari ${mNames[refDate.getMonth()]} ${refDate.getFullYear()}</span><span>Halaman ${state.eventPage} dari ${totalPages} (${list.length} total agenda)</span></div></div>`;
}

function getData(s){

  if(s.ticker==='IHSG'&&typeof window!=='undefined'&&window.IHSG_LIVE_DATA&&window.IHSG_LIVE_DATA.ohlc&&window.IHSG_LIVE_DATA.ohlc.length){

function periodLabel(){return {'1M':'1 bulan','3M':'3 bulan','6M':'6 bulan','1Y':'1 tahun'}[state.period]}
let _aiAnalysisCache = {};
let _aiAnalyzing = {};

async function generateAIAnalysis(ticker, force = false) {
  ticker = ticker || (state.route === 'stock' ? state.ticker : (state.activeInstrument || 'IHSG'));
  _aiAnalyzing[ticker] = true;
  drawChart();

  const tech = window._currentTechData || {};

  try {
    const res = await fetch('/api/ai-analysis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ticker: ticker,
        technical: tech,
        force: force
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    _aiAnalysisCache[ticker] = data;
    notify(`Analisis Gemini AI untuk ${ticker} berhasil digenerate!`);
  } catch (err) {
    console.error('[AI Analysis Error]', err);
    notify(`Gagal mengambil analisis AI: ${err.message}`, 4000);
  } finally {
    _aiAnalyzing[ticker] = false;
    drawChart();
  }
}

function renderAI(c, s, isStock) {
  const el = document.getElementById('ai-summary');
  if (!el) return;

  const ticker = isStock ? s.ticker : 'IHSG';

  const rs = rsi(c.full);
  const above20 = s.price > ma20;
  const above50 = s.price > ma50;
  const support = c.levels.filter(l => l.value < s.price).sort((a,b) => b.value - a.value);

// ── BERITA REAL-TIME via /api/news ──────────────────────────────────────────
let _newsCache = {};
let _newsFetching = {};

async function fetchNews(ticker) {
  ticker = ticker || 'IHSG';
  const grid = document.getElementById('news-grid');
  const badge = document.getElementById('news-live-badge');
  const staticBadge = document.getElementById('news-static-badge');
  const subtitle = document.getElementById('news-subtitle');
  if (!grid) return;

  // Cek cache 15 menit
  const cached = _newsCache[ticker];
  if (cached && (Date.now() - cached.ts) < 15 * 60 * 1000) {
    renderNewsCards(cached.data, ticker);
    return;
  }

  // Hindari double fetch
  if (_newsFetching[ticker]) return;
  _newsFetching[ticker] = true;

  // Tampilkan skeleton loading
  grid.innerHTML = newsLoadingCards();
  if (staticBadge) { staticBadge.textContent = 'Memuat berita...'; staticBadge.style.display = ''; }
  if (badge) badge.style.display = 'none';

  try {
    const res = await fetch(`/api/news?ticker=${ticker}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    _newsCache[ticker] = { ts: Date.now(), data };
    renderNewsCards(data, ticker);
  } catch (err) {
    console.warn('[News] Server offline atau error:', err);
    // Fallback: pakai data dummy NEWS lama
    if (grid) {
      grid.innerHTML = NEWS.map((n,i) => `<button class="card news-card" data-news="${i}" aria-label="Baca berita: ${n.title}">
        <div class="news-meta"><span class="news-category">${icon(n.icon,'sm')} ${n.category}</span><span>Simulasi</span></div>
        <h3>${n.title}</h3><p>${n.desc}</p>
        <div class="news-bottom"><span>${n.impact}</span>${icon('arrow-up-right','sm')}</div>
      </button>`).join('');
    }
    if (staticBadge) staticBadge.textContent = 'Koneksi server offline';
    if (badge) badge.style.display = 'none';
  } finally {
    _newsFetching[ticker] = false;
  }
}

function renderNewsCards(data, ticker) {
  const grid = document.getElementById('news-grid');
  const badge = document.getElementById('news-live-badge');
  const staticBadge = document.getElementById('news-static-badge');
  const subtitle = document.getElementById('news-subtitle');
  if (!grid) return;

  const name = ticker === 'IHSG' ? 'IHSG & Pasar Modal Indonesia' : ticker;
  if (subtitle) subtitle.textContent = `Berita terbaru seputar ${name}.`;

  if (!data || data.length === 0 || data[0]?.error) {
    grid.innerHTML = `<div class="card" style="padding:24px;text-align:center;color:var(--muted);grid-column:1/-1">
      <p style="font-size:13px">Berita tidak tersedia untuk ${ticker}. Coba refresh beberapa saat lagi.</p>
    </div>`;
    if (staticBadge) { staticBadge.textContent = 'Tidak tersedia'; staticBadge.style.display = ''; }
    if (badge) badge.style.display = 'none';
    return;
  }

  grid.innerHTML = data.map((n, i) => {
    const iconName = n.icon || 'chart';
    const dateStr = n.date || '';
    const isLive = n.live !== false;
    const biasColor = n.bias === 'positif' ? 'positive' : n.bias === 'negatif' ? 'negative' : '';
    return `<button class="card news-card" data-live-news="${i}" aria-label="Baca berita: ${n.title}">
      <div class="news-meta">
        <span class="news-category">${icon(iconName,'sm')} ${n.category}</span>
        <span>${dateStr}${isLive ? ' · Live' : ''}</span>
      </div>
      <h3>${n.title}</h3>
      <p>${n.desc}</p>
      <div class="news-bottom">
        <span class="${biasColor}">${n.impact}</span>${icon('arrow-up-right','sm')}
      </div>
    </button>`;
  }).join('');

  if (badge) badge.style.display = '';
  if (staticBadge) staticBadge.style.display = 'none';

  // Simpan data untuk drawer
  window._liveNews = data;
}

function refreshNews() {
  const ticker = state.route === 'stock' ? state.ticker : (state.activeInstrument || 'IHSG');
  delete _newsCache[ticker];
  fetchNews(ticker);
}

// Keep the active range input alive during drags and keyboard adjustments.
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.valuation){const type=t.dataset.valuation,s=getStock(state.ticker);valuation(s)[type]=Number(t.value);const holder=document.getElementById('valuation-'+type),temp=document.createElement('div');temp.innerHTML=valuationCard(s,type);for(const sel of ['.valuation-price','.mos-pill','.valuation-range'])holder.querySelector(sel).outerHTML=temp.querySelector(sel).outerHTML;holder.querySelector('output').textContent=temp.querySelector('output').textContent}});
const searchInput=document.getElementById('stock-search');searchInput.addEventListener('focus',searchRender);searchInput.addEventListener('input',searchRender);searchInput.addEventListener('keydown',e=>{const open=document.getElementById('search-results').classList.contains('open');if(e.key==='Escape'){closeSearch();searchInput.blur();return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!open)searchRender();if(!searchMatches.length)return;selectedSearch=(selectedSearch+(e.key==='ArrowDown'?1:-1)+searchMatches.length)%searchMatches.length;document.querySelectorAll('[data-result]').forEach((el,i)=>{el.classList.toggle('selected',i===selectedSearch);el.setAttribute('aria-selected',String(i===selectedSearch))});searchInput.setAttribute('aria-activedescendant','result-'+selectedSearch)}if(e.key==='Enter'){e.preventDefault();if(searchMatches[selectedSearch])goStock(searchMatches[selectedSearch].ticker)}});
document.addEventListener('keydown',e=>{const layer=document.getElementById('modal-layer');if(layer.classList.contains('open')){if(e.key==='Escape'){e.preventDefault();closeDrawer()}if(e.key==='Tab'){const els=[...layer.querySelectorAll('button,a[href],input,select,[tabindex="0"]')].filter(x=>!x.disabled),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}return}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();searchInput.focus()}if(e.key==='Escape')closeSearch();if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...document.querySelectorAll('[role="tab"]')],i=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].focus();tabs[next].click()}});
document.getElementById('drawer-close').addEventListener('click',closeDrawer);document.getElementById('modal-layer').addEventListener('click',e=>{if(e.target.id==='modal-layer')closeDrawer()});window.addEventListener('hashchange',()=>{closeSearch();if(document.getElementById('modal-layer').classList.contains('open'))closeDrawer();state.period='3M';state.finTab='income';state.docFilter='all';render();window.scrollTo(0,0)});window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(drawChart,120)});
document.getElementById('search-icon').innerHTML=icon('search','sm');document.getElementById('drawer-close').innerHTML=icon('close');document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon,'sm'));render();
</script>
</body>
</html>
